<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Play with BITSians: private multiplayer paintball matches with your friends on the BITS Pilani campus." />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Play with BITSians</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/", "@colyseus/sdk": "./vendor/colyseus/colyseus.mjs" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- the start screen: the multiplayer paintball portal (js/portal/portal.js) fills this -->
  <div id="title">
    <div class="title-card">
      <h1>PLAY WITH<br />BITSIANS</h1>
      <p class="title-tag">Loading…</p>
      <noscript><p>Play with BITSians needs JavaScript.</p></noscript>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-box">
        <div id="hud-class"></div>
        <div class="hud-line"><span id="hud-time"></span> <span id="hud-slot"></span></div>
        <div class="hud-line hud-sub"><span id="hud-move"></span><span id="hud-ff" class="hidden">⏩ FAST FORWARD ×4</span></div>
      </div>
      <div class="hud-box right"><div id="hud-progress"></div></div>
    </div>
    <div class="hud-mission"><span class="hud-label">Now</span> <span id="hud-mission"></span></div>
    <div class="objective hidden"><div id="arrow">▲</div><div id="arrow-text"></div></div>
    <div id="crosshair"></div>
    <div id="anthem" class="hidden">
      <div class="anthem-title">🇮🇳 National Anthem · Jana Gana Mana · stand at attention and sing along</div>
      <div id="anthem-dev"></div>
      <div id="anthem-rom"></div>
      <div class="bar"><div id="anthem-bar" class="bar-fill"></div></div>
      <div class="anthem-mic"><span id="anthem-mic-text"></span><div class="bar"><div id="anthem-mic-bar" class="bar-fill mic-fill"></div></div></div>
      <div id="anthem-skip" class="anthem-skip">Press Enter (or say “skip”) to skip</div>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="resume-hint" class="hidden">Click to play · <kbd>H</kbd> help · <kbd>Esc</kbd> pause</div>
    <div class="hud-keys"><kbd>T</kbd> Timetable <kbd>M</kbd> Missions <kbd>J</kbd> Journey <kbd>V</kbd> View <kbd>F</kbd> Voice <kbd>Shift</kbd> Walk <kbd>C</kbd> Cycle <kbd>Z</kbd> Fast-forward <kbd>N</kbd> Map</div>
  </div>

  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="mic"><span class="dot"></span><span class="mic-text">Listening…</span></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
