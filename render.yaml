# Render Blueprint: the multiplayer paintball game server only (the static site stays on Vercel).
# Builds from the repo root so the server can import the shared rules in js/paintball/, but installs only
# server/package.json's production dependencies (Colyseus): no dev dependencies, no three.js or browser assets.
services:
  - type: web
    name: play-with-bitsians-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --prefix server
    startCommand: npm run server
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - js/paintball/**
        - js/paintball/data/campus-collision.bin
        - js/paintball/data/campus-collision.json
        - js/paintball/data/royale-spots.json
        - render.yaml
        - package.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render provides PORT; the server binds 0.0.0.0:$PORT. Extra browser origins (comma-separated) besides
      # https://play-with-bitsians.vercel.app, https://play-with-bitsian.vercel.app and localhost are always allowed; extra
      # origins go in ALLOWED_ORIGINS, set in the Render dashboard (sync: false keeps it across Blueprint syncs).
      - key: ALLOWED_ORIGINS
        sync: false
